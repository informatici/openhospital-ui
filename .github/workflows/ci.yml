name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - "develop"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Installing...
        run: npm i
      - name: Building...
        env:
          CI: false
        run: npm run build

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Installing...
        run: npm i
      - name: Testing...
        run: npm test

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Installing...
        run: npm i
      - name: Type Checking...
        run: npm run tsc

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Installing...
        run: npm i
      - name: Linting...
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # https://github.com/cypress-io/github-action
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          record: false
          start: npm run start:ci
          wait-on: "http://localhost:5173"
